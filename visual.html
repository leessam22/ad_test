<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>시각형 학습 체험</title>
    <style>
        /* 모든 요소의 크기 계산 방식 통일 (패딩 포함) */
        * { box-sizing: border-box; }

        :root {
            --color-visual: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --text-main: #1e293b;
        }

        /* 화면 전체 스크롤 금지 */
        html, body { 
            height: 100vh; 
            width: 100vw;
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #f8fafc;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page-container {
            width: 95%;
            max-width: 500px;
            height: 96vh; /* 화면 높이의 96%만 사용하도록 제한 */
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column; /* 세로로 배치 */
        }

        .main-header {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: #333;
            margin-bottom: 15px;
            flex-shrink: 0; /* 제목 크기 고정 */
        }

        /* 사라졌던 설명 부분 복구 */
        .type-badge-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .icon-box {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: var(--color-visual);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-box svg { width: 24px; height: 24px; fill: white; }

        .title-group { display: flex; flex-direction: column; }

        .type-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin: 0; }

        .type-desc-text { font-size: 0.85rem; color: #64748b; margin: 2px 0 0 0; }

        /* 핵심: 영상 영역 - 남은 공간을 모두 차지하되 넘치지 않음 */
        .video-clip-wrapper {
            position: relative;
            flex-grow: 1; /* 남는 공간 자동 차지 */
            width: 100%;
            border-radius: 15px;
            overflow: hidden; 
            background: #000;
            margin-bottom: 15px;
        }

        /* EBS 상단 버튼 가리기 기법 */
        .video-clip-wrapper iframe {
            position: absolute;
            top: -128px; /* 버튼 가리기 높이 */
            left: 0;
            width: 100%;
            height: calc(100% + 128px);
            border: none;
        }

        .footer-info {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .back-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #ff9a9e;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 12px;
            border: 2px solid #ff9a9e;
            border-radius: 15px;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .back-btn:hover { background: #ff9a9e; color: white; }
    </style>
</head>
<body>

<div class="page-container">
    <div class="main-header">AI 디지털 학습 도구 체험</div>

    <div class="type-badge-row">
        <div class="icon-box">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </div>
        <div class="title-group">
            <h2 class="type-title">시각형</h2>
            <p class="type-desc-text">이미지, 영상, 인포그래픽 활용 학습</p>
        </div>
    </div>

    <div class="video-clip-wrapper">
        <iframe src="https://www.ebs.co.kr/onAirPlayer/onair_PLUS2.html" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <p class="footer-info">
        시각 자료는 복잡한 개념을 직관적으로 이해하도록 돕습니다.
    </p>

    <a href="index.html" class="back-btn">메인으로 돌아가기</a>
</div>

</body>
</html>
