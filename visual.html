<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>시각형 학습 체험</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --color-visual: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --text-main: #1e293b;
        }

        /* 1. 스크롤바 원천 차단 */
        html, body { 
            height: 100dvh; /* 기기 주소창 제외한 실제 높이 */
            margin: 0; 
            padding: 0; 
            overflow: hidden; /* 스크롤바 절대 생성 금지 */
            background-color: #f8fafc;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center; /* 화면 정중앙 배치 */
        }

        .page-container {
            width: 92%;
            max-width: 450px;
            height: 94dvh; /* 화면 높이의 94% 안에서 모든 걸 해결 */
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 요소들 사이 간격을 균등 분배 */
        }

        .main-header {
            text-align: center;
            font-size: 1rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            flex-shrink: 0; /* 크기 절대 안 줄어듦 */
        }

        .type-badge-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--color-visual);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-box svg { width: 20px; height: 20px; fill: white; }

        .title-group { display: flex; flex-direction: column; }
        .type-title { font-size: 1rem; font-weight: 700; color: var(--text-main); margin: 0; }
        .type-desc-text { font-size: 0.75rem; color: #64748b; margin: 0; }

        /* 2. 핵심: 영상 영역이 남는 공간에 맞춰 스스로 줄어듦 */
        .video-clip-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1; /* 남는 공간 다 차지 */
            flex-shrink: 1; /* 공간 부족하면 스스로 작아짐 */
            min-height: 0; /* 중요: flex 안에서 줄어들 수 있게 함 */
            border-radius: 15px;
            overflow: hidden; 
            background: #000;
            margin-bottom: 10px;
        }

        .video-clip-wrapper iframe {
            position: absolute;
            top: -128px; /* EBS 버튼 가리기 */
            left: 0;
            width: 100%;
            height: calc(100% + 128px);
            border: none;
        }

        .footer-info {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.3;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .back-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #ff9a9e;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 12px;
            border: 2px solid #ff9a9e;
            border-radius: 15px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="main-header">AI 디지털 학습 도구 체험</div>

    <div class="type-badge-row">
        <div class="icon-box">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </div>
        <div class="title-group">
            <h2 class="type-title">시각형</h2>
            <p class="type-desc-text">이미지, 영상, 인포그래픽 활용 학습</p>
        </div>
    </div>

    <div class="video-clip-wrapper">
        <iframe src="https://www.ebs.co.kr/onAirPlayer/onair_PLUS2.html" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <p class="footer-info">
        시각 자료는 복합적인 개념을 직관적으로 이해하도록 돕습니다.
    </p>

    <a href="index.html" class="back-btn">메인으로 돌아가기</a>
</div>

</body>
</html>
