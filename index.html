<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 디지털 학습 유형</title>
    <style>
        :root { --primary: #4A90E2; --bg: #F5F7FA; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; width: 100%; max-width: 500px; border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .title-box { border: 2px solid #333; padding: 15px; margin-bottom: 30px; border-radius: 10px; font-size: 1.5rem; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item { background: #fff; border: 1.5px solid #eee; padding: 25px 10px; border-radius: 15px; text-decoration: none; color: #444; font-weight: 600; transition: 0.2s; display: flex; align-items: center; justify-content: center; min-height: 80px; }
        .item:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(74,144,226,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-box">AI·디지털 학습 유형</div>
        <div class="grid">
            <a href="link1.html" class="item">시각형</a>
            <a href="link2.html" class="item">청각형</a>
            <a href="link3.html" class="item">체험형</a>
            <a href="link4.html" class="item">혼합형</a>
        </div>
    </div>
</body>
</html>
