<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 디지털 학습 도구 체험</title>
    <style>
        :root {
            --bg: #f8fafc;
            --font-main: #1e293b;
            /* 테마별 그라데이션 색상 */
            --color-visual: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --color-audio: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            --color-exp: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            --color-mix: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
        }

        header {
            background: white;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: 2px solid #333; /* 요청하신 테두리 스타일 */
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--font-main);
            font-weight: 800;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 25px 15px;
            text-decoration: none;
            color: var(--font-main);
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
            border-color: #333;
        }

        /* 아이콘 박스 */
        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* 각 카드별 색상 적용 */
        .visual { background: var(--color-visual); }
        .audio { background: var(--color-audio); }
        .exp { background: var(--color-exp); }
        .mix { background: var(--color-mix); }

        /* 모바일 반응형: 1열 배치 */
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .card { flex-direction: row; padding: 20px 25px; gap: 20px; }
            .icon-box { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI 디지털 학습 도구 체험</h1>
    </header>

    <div class="grid">
        <a href="visual.html" class="card">
            <div class="icon-box visual">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </div>
            <span class="card-title">시각형</span>
        </a>

        <a href="audio.html" class="card">
            <div class="icon-box audio">
                <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v7c0 1.1.9 2 2 2h4v-8H5v-1c0-3.87 3.13-7 7-7s7 3.13 7 7v1h-4v8h4c1.1 0 2-.9 2-2v-7a9 9 0 0 0-9-9z"/></svg>
            </div>
            <span class="card-title">청각형</span>
        </a>

        <a href="exp.html" class="card">
            <div class="icon-box exp">
                <svg viewBox="0 0 24 24"><path d="M7 1.5c-1.93 0-3.5 1.57-3.5 3.5v11.5c0 1.93 1.57 3.5 3.5 3.5h10c1.93 0 3.5-1.57 3.5-3.5V5c0-1.93-1.57-3.5-3.5-3.5H7zm0 2h10c.83 0 1.5.67 1.5 1.5v11.5c0 .83-.67 1.5-1.5 1.5H7c-.83 0-1.5-.67-1.5-1.5V5c0-.83.67-1.5 1.5-1.5zM12 7l-4 4h8l-4-4z"/></svg>
            </div>
            <span class="card-title">체험형</span>
        </a>

        <a href="mix.html" class="card">
            <div class="icon-box mix">
                <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5c0-1.1-.9-2-2-2s-2 .9-2 2V5H5c-1.1 0-1.99.9-1.99 2v3.8H4.5c1.1 0 2 .9 2 2s-.9 2-2 2H3.01V17c0 1.1.9 2 2 2h3.8v-1.5c0-1.1.9-2 2-2s2 .9 2 2V19h4c1.1 0 2-.9 2-2v-4h1.5c1.1 0 2-.9 2-2s-.9-2-2-2z"/></svg>
            </div>
            <span class="card-title">혼합형</span>
        </a>
    </div>
</div>

</body>
</html>
